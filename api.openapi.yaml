components:
  schemas:
    UpdatePost:
      type: object
      properties:
        id:
          type: integer
          description: Reference ID
        created:
          type: string
          description: ISO format time representation
          format: date-time
        header:
          type:
            - string
            - 'null'
          description: Leading header text, in bold color and monospace font
        title:
          type: string
          description: Title text in Futura font
        summary:
          type: string
          description: Tweet content in system Sans font
        mask:
          $ref: '#/components/schemas/Shape'
          description: Shape of the mask
        locale:
          $ref: '#/components/schemas/SupportedLocale'
          description: Target locale of the post
        trashed:
          type: boolean
          description: Whether to not display this post
        cover:
          anyOf:
            - $ref: '#/components/schemas/UpdatePostCover'
            - type: 'null'
      required:
        - id
        - created
        - title
        - summary
        - mask
        - locale
        - header
        - trashed
        - cover
    Shape:
      type: string
      enum:
        - clover
        - elevenSidedStar
        - sixSidedStar
        - tiltedOval
        - tiltedPentagon
        - tiltedRectangle
    SupportedLocale:
      type: string
      enum:
        - en
        - zh
        - zh-tw
    Image:
      type: object
      properties:
        id:
          type: integer
          description: Image identifier
        url:
          type: string
          format: uri
          description: Publicly accessible URL
        alt:
          type: string
          description: Alernative text describing the image content
      required:
        - id
        - url
        - alt
    GalleryItem:
      type: object
      properties:
        id:
          type: integer
          description: Gallery item Identifier
        locale:
          anyOf:
            - $ref: '#/components/schemas/SupportedLocale'
            - type: 'null'
          description: >-
            Target locale, null if it's for global audience so no specific
            locale
        tweet:
          type:
            - string
            - 'null'
          description: Comment on this item
        image:
          type: string
          description: Image identifier
          format: uri
        created:
          type: string
          format: date-time
          description: Item creation time in ISO format
        alt:
          type: string
          description: Alternative text describing image
        trashed:
          type: boolean
          description: Whether to not display this item in the gallery
      required:
        - id
        - locale
        - tweet
        - image
        - created
        - alt
        - trashed
    UpdatePostCover:
      type: object
      properties:
        image:
          type: string
          format: uri
          description: Image URL
        alt:
          type: string
          description: Alternative text
      required:
        - image
        - alt
  responses: {}
  securitySchemes:
    PostAuthKey:
      type: apiKey
      in: header
      name: X-POST-AUTH-KEY
servers: []
security:
  - PostAuthKey: []
