openapi: 3.1.0
info:
  title: api
  description: API to post and manage stuff
  version: 1.0.0
tags: []
paths:
  /update/template:
    get:
      summary: Update Post Card Template
      deprecated: false
      description: |-
        Variables are wrapped in ${...}.

        - ${cover.src}
        - ${cover.alt}
        - ${header.leading}
        - ${header.tailing}
        - ${title}
        - ${summary}
      tags: []
      parameters: []
      responses:
        '200':
          description: ''
          content:
            text/html:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
        - PostAuthKey: []
  /update/list:
    get:
      summary: List Update Posts
      deprecated: false
      description: Get a list of availble updates (the top-most section in highlight page)
      tags: []
      parameters:
        - name: locale
          in: query
          description: Accepted locale names
          required: false
          example:
            - ''
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          description: At most how many results to return
          required: false
          example: 1
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpdatePost'
          headers: {}
        '400':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
        - PostAuthKey: []
  /update:
    put:
      summary: Create Update Post
      deprecated: false
      description: ''
      tags: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  description: Target locale of this post
                  $ref: '#/components/schemas/SupportedLocale'
                header:
                  type: string
                  description: Top header of the card, in bold color and monospaced font
                title:
                  type: string
                  description: Title in Futura font
                summary:
                  type: string
                  description: Tweet in Sans font
                cover:
                  type: integer
                  description: Cover image identifier
                mask:
                  $ref: '#/components/schemas/Shape'
                  description: Mask to the cover image
              required:
                - locale
                - header
                - title
                - summary
                - mask
            example:
              locale: en
              header: exercitation mollit in ipsum tempor
              title: accentuate bah orientate basic accept
              summary: culpa aliqua sed nulla enim
              mask: clover
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: number
                description: Post identifier
          headers: {}
      security:
        - PostAuthKey: []
  /update/{id}:
    patch:
      summary: Patch Update Post
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  $ref: '#/components/schemas/SupportedLocale'
                  description: Target locale of this post
                header:
                  type: string
                  description: Top header of the card
                title:
                  type: string
                summary:
                  type: string
                cover:
                  type: integer
                  description: Image identifier
                mask:
                  $ref: '#/components/schemas/Shape'
                trashed:
                  type: boolean
            examples: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Null if no modifications were (required to be) made
                $ref: '#/components/schemas/UpdatePost'
          headers: {}
        '400':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
          headers: {}
        '404':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
          headers: {}
      security:
        - PostAuthKey: []
    delete:
      summary: Delete Update Post
      deprecated: false
      description: >-
        Note that this endpoint removes the post DIRECTLY without trashing it.
        Use the PATCH method in such scenario.
      tags: []
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          example: 10
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePost'
          headers: {}
      security:
        - PostAuthKey: []
    get:
      summary: Query Update Post
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: integer
