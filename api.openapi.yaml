  /image:
    post:
      summary: Upload Image
      deprecated: false
      description: Upload image to the CDN via the server as proxy
      tags: []
      parameters:
        - name: X-Alt-Text
          in: header
          description: Alernative text describing the image content
          required: true
          example: ''
          schema:
            type: string
        - name: X-FIle-Name
          in: header
          description: Name of the original image file
          required: true
          example: ''
          schema:
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            examples: {}
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Image identifier in plain text
                  url:
                    type: string
                    description: Publicly accessible image URL
                    format: uri
                required:
                  - id
                  - url
          headers: {}
      security:
        - PostAuthKey: []
    put:
      summary: Assign Image to CDN Resource
      deprecated: false
      description: Often used if the image was uploaded on client side
      tags: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: CDN URL, publicly accessible
                  format: uri
                alt:
                  type: string
                  description: Alernative text describing the image
              required:
                - url
                - alt
            examples: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: integer
                description: Image identifier, if url exists and alt is modified
          headers: {}
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: number
                description: Image identifier, if newly created
          headers: {}
        '304':
          description: ''
          content:
            application/json:
              schema:
                type: integer
                description: Image identifier, if nothing has been modified
          headers: {}
      security:
        - PostAuthKey: []
